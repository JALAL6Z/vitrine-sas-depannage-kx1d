<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAS Dépannage — Remorquage & Assistance Lyon 7e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* =========================================
   CSS VARIABLES & RESET
========================================= */
:root {
  --bg-primary: #08111f;
  --bg-secondary: #0d1a2e;
  --bg-card: #101e33;
  --bg-card-hover: #142540;
  --gold: #c9963a;
  --gold-light: #e0b35a;
  --gold-dim: rgba(201,150,58,0.15);
  --text-primary: #f0e8dc;
  --text-secondary: #8a9bb0;
  --text-muted: #4a5a70;
  --white: #ffffff;
  --red-banner: #991b1b;
  --border: rgba(201,150,58,0.2);
  --border-hover: rgba(201,150,58,0.7);
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'DM Sans', system-ui, sans-serif;
  --transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  --radius: 4px;
  --shadow-gold: 0 0 40px rgba(201,150,58,0.12);
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-weight: 400;
  line-height: 1.6;
  overflow-x: hidden;
}

/* =========================================
   SCROLLBAR
========================================= */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

/* =========================================
   TIMER BANNER — STICKY TOP
========================================= */
#timer-banner {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  background: var(--red-banner);
  text-align: center;
  padding: 10px 20px;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

#timer-banner span.timer-label {
  opacity: 0.9;
}

#timer-banner span.timer-value {
  background: rgba(0,0,0,0.3);
  padding: 2px 10px;
  border-radius: 3px;
  font-family: monospace;
  font-size: 1rem;
  letter-spacing: 0.1em;
  color: #ffc;
}

/* Offset for sticky banner */
body { padding-top: 40px; }

/* =========================================
   NAVIGATION STICKY
========================================= */
nav {
  position: sticky;
  top: 40px;
  z-index: 900;
  width: 100%;
  background: rgba(8,17,31,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 5%;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.nav-logo .logo-main {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--gold);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.nav-logo .logo-sub {
  font-size: 0.68rem;
  color: var(--text-secondary);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 400;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 30px;
  list-style: none;
}

.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: var(--transition);
}

.nav-links a:hover {
  color: var(--gold);
}

.nav-cta {
  background: var(--gold);
  color: var(--bg-primary) !important;
  padding: 10px 22px;
  border-radius: var(--radius);
  font-weight: 600 !important;
  letter-spacing: 0.06em;
  transition: var(--transition) !important;
}

.nav-cta:hover {
  background: var(--gold-light) !important;
  color: var(--bg-primary) !important;
  box-shadow: 0 4px 20px rgba(201,150,58,0.4) !important;
  transform: translateY(-1px);
}

/* =========================================
   HERO SECTION
========================================= */
#hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(201,150,58,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(201,150,58,0.04) 0%, transparent 60%),
    var(--bg-primary);
  padding: 60px 5% 80px;
}

/* Decorative lines */
#hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.hero-grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(201,150,58,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,150,58,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

.hero-content {
  max-width: 900px;
  margin: 0 auto;
  text-align: center;
  position: relative;
  z-index: 2;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 28px;
}

.hero-eyebrow::before,
.hero-eyebrow::after {
  content: '';
  width: 30px;
  height: 1px;
  background: var(--gold);
}

.hero-title {
  font-family: var(--font-serif);
  font-size: clamp(2.8rem, 7vw, 5.5rem);
  line-height: 1.1;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 24px;
}

.hero-title em {
  font-style: italic;
  color: var(--gold);
}

.hero-subtitle {
  font-size: 1.05rem;
  color: var(--text-secondary);
  max-width: 540px;
  margin: 0 auto 48px;
  line-height: 1.7;
  font-weight: 300;
}

/* Hero Stats */
.hero-stats {
  display: flex;
  justify-content: center;
  gap: 0;
  margin-bottom: 52px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  background: var(--bg-card);
}

.stat-item {
  flex: 1;
  padding: 24px 20px;
  text-align: center;
  position: relative;
  transition: var(--transition);
}

.stat-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 20%;
  height: 60%;
  width: 1px;
  background: var(--border);
}

.stat-item:hover {
  background: var(--bg-card-hover);
}

.stat-number {
  font-family: var(--font-serif);
  font-size: 2rem;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
  display: block;
  margin-bottom: 6px;
}

.stat-label {
  font-size: 0.72rem;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
}

/* Hero CTA Buttons */
.hero-ctas {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--gold);
  color: var(--bg-primary);
  padding: 16px 36px;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.9rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  transition: var(--transition);
  border: none;
  cursor: pointer;
}

.btn-primary:hover {
  background: var(--gold-light);
  box-shadow: 0 8px 30px rgba(201,150,58,0.45);
  transform: translateY(-2px);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: transparent;
  color: var(--text-primary);
  padding: 16px 36px;
  border-radius: var(--radius);
  font-weight: 500;
  font-size: 0.9rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  transition: var(--transition);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  border-color: var(--gold);
  color: var(--gold);
  background: var(--gold-dim);
  transform: translateY(-2px);
}

/* =========================================
   TRUST RIBBON
========================================= */
#trust-ribbon {
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 28px 5%;
}

.trust-grid {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px 32px;
  max-width: 1100px;
  margin: 0 auto;
}

.trust-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.trust-item .check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: var(--gold);
  flex-shrink: 0;
}

.trust-sep {
  width: 1px;
  height: 30px;
  background: var(--border);
}

/* =========================================
   MARQUEE
========================================= */
#marquee-section {
  overflow: hidden;
  padding: 22px 0;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border);
  position: relative;
}

#marquee-section::before,
#marquee-section::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0; width: 120px;
  z-index: 2;
  pointer-events: none;
}
#marquee-section::before {
  left: 0;
  background: linear-gradient(90deg, var(--bg-primary), transparent);
}
#marquee-section::after {
  right: 0;
  background: linear-gradient(-90deg, var(--bg-primary), transparent);
}

.marquee-track {
  display: flex;
  gap: 0;
  width: max-content;
  animation: marquee-scroll 35s linear infinite;
}

.marquee-item {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 0 32px;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}

.marquee-item .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  flex-shrink: 0;
}

@keyframes marquee-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* =========================================
   SERVICES SECTION
========================================= */
#services {
  padding: 100px 5%;
  background: var(--bg-primary);
}

.section-header {
  text-align: center;
  margin-bottom: 70px;
}

.section-tag {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 14px;
  position: relative;
}

.section-title {
  font-family: var(--font-serif);
  font-size: clamp(2rem, 4.5vw, 3.2rem);
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.15;
  margin-bottom: 16px;
}

.section-title em {
  font-style: italic;
  color: var(--gold);
}

.section-desc {
  font-size: 0.95rem;
  color: var(--text-secondary);
  max-width: 500px;
  margin: 0 auto;
  line-height: 1.7;
}

/* Services Grid */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 2px;
  max-width: 1100px;
  margin: 0 auto;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.service-card {
  background: var(--bg-card);
  padding: 44px 36px;
  position: relative;
  overflow: hidden;
  transition: var(--transition);
  cursor: default;
}

.service-card::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  height: 3px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
}

.service-card:hover::before {
  transform: scaleX(1);
}

.service-card:hover {
  background: var(--bg-card-hover);
}

.service-number {
  font-family: var(--font-serif);
  font-size: 3.5rem;
  font-weight: 700;
  color: rgba(201,150,58,0.12);
  line-height: 1;
  margin-bottom: 20px;
  transition: var(--transition);
}

.service-card:hover .service-number {
  color: rgba(201,150,58,0.25);
}

.service-icon {
  font-size: 2rem;
  margin-bottom: 16px;
  display: block;
}

.service-name {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 12px;
  line-height: 1.2;
}

.service-desc {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.65;
}

.service-arrow {
  display: inline-block;
  margin-top: 20px;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
  opacity: 0;
  transform: translateX(-8px);
  transition: var(--transition);
}

.service-card:hover .service-arrow {
  opacity: 1;
  transform: translateX(0);
}

/* =========================================
   TESTIMONIALS
========================================= */
#testimonials {
  padding: 100px 5%;
  background: var(--bg-secondary);
  position: relative;
  overflow: hidden;
}

#testimonials::before {
  content: '"';
  position: absolute;
  top: -30px;
  left: 5%;
  font-family: var(--font-serif);
  font-size: 25rem;
  color: rgba(201,150,58,0.03);
  line-height: 1;
  pointer-events: none;
  user-select: none;
}

.testimonials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 28px;
  max-width: 1100px;
  margin: 0 auto;
}

.testimonial-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 36px 32px;
  position: relative;
  transition: var(--transition);
}

.testimonial-card:hover {
  border-color: var(--border-hover);
  box-shadow: var(--shadow-gold);
  transform: translateY(-4px);
}

.testimonial-quote-mark {
  font-family: var(--font-serif);
  font-size: 3rem;
  color: var(--gold);
  opacity: 0.4;
  line-height: 0.8;
  margin-bottom: 16px;
}

.testimonial-text {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.75;
  font-style: italic;
  margin-bottom: 28px;
}

.testimonial-footer {
  display: flex;
  align-items: center;
  gap: 14px;
}

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--gold-dim);
  border: 2px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 1rem;
  color: var(--gold);
  flex-shrink: 0;
}

.testimonial-author-name {
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--text-primary);
  margin-bottom: 3px;
}

.testimonial-author-info {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.stars {
  margin-bottom: 6px;
  color: var(--gold);
  font-size: 0.85rem;
  letter-spacing: 2px;
}

/* =========================================
   CTA FINALE + PRICE BOX
========================================= */
#cta-final {
  padding: 100px 5%;
  background: var(--bg-primary);
  position: relative;
  overflow: hidden;
}

#cta-final::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(201,150,58,0.06) 0%, transparent 70%);
  pointer-events: none;
}

.cta-inner {
  max-width: 880px;
  margin: 0 auto;
  text-align: center;
  position: relative;
  z-index: 2;
}

.cta-title {
  font-family: var(--font-serif);
  font-size: clamp(2rem, 4.5vw, 3rem);
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 18px;
  line-height: 1.15;
}

.cta-title em {
  font-style: italic;
  color: var(--gold);
}

.cta-subtitle {
  font-size: 1rem;
  color: var(--text-secondary);
  margin-bottom: 56px;
}

/* Price Boxes */
.price-boxes {
  display: flex;
  gap: 24px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 48px;
}

.price-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 36px 32px;
  flex: 1;
  min-width: 220px;
  max-width: 280px;
  text-align: center;
  transition: var(--transition);
  position: relative;
}

.price-box:hover {
  border-color: var(--gold);
  box-shadow: var(--shadow-gold);
  transform: translateY(-4px);
}

.price-box.featured {
  border-color: var(--gold);
  background: var(--bg-card-hover);
}

.price-box-badge {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gold);
  color: var(--bg-primary);
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 14px;
  border-radius: 20px;
}

.price-box-icon {
  font-size: 2.2rem;
  margin-bottom: 14px;
  display: block;
}

.price-box-title {
  font-family: var(--font-serif);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.price-box-desc {
  font-size: 0.8rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 20px;
}

.price-box-cta {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: var(--transition);
}

.price-box-cta:hover {
  gap: 10px;
}

.cta-phone-big {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-serif);
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 700;
  color: var(--gold);
  text-decoration: none;
  transition: var(--transition);
  border-bottom: 2px solid transparent;
  padding-bottom: 4px;
}

.cta-phone-big:hover {
  color: var(--gold-light);
  border-bottom-color: var(--gold-light);
}

.cta-phone-label {
  display: block;
  font-family: var(--font-sans);
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 400;
  margin-top: 8px;
}

/* =========================================
   FOOTER
========================================= */
footer {
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  padding: 60px 5% 40px;
}

.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
}

.footer-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 40px;
  flex-wrap: wrap;
  margin-bottom: 48px;
  padding-bottom: 48px;
  border-bottom: 1px solid var(--border);
}

.footer-brand .logo-main {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--gold);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 6px;
}

.footer-brand .logo-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.footer-phone {
  font-family: var(--font-serif);
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 700;
  color: var(--gold);
  text-decoration: none;
  transition: var(--transition);
  display: block;
}

.footer-phone:hover {
  color: var(--gold-light);
}

.footer-phone-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 4px;
}

.footer-address {
  text-align: right;
}
